<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your car</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}@keyframes tIn{0%{transform:translate(-50%,-70px);opacity:0}100%{transform:translate(-50%,0);opacity:1}}@media (prefers-reduced-motion: reduce){[role=status]{animation:none!important}}</style>

<div style="width:390px;height:844px;box-sizing:border-box;background:#0B0B0C;color:#F2F2F3;font-family:'Be Vietnam Pro',-apple-system,system-ui,sans-serif;display:flex;flex-direction:column;padding:56px 20px 30px;position:relative;overflow:hidden">

<sc-if value="{{toast}}" hint-placeholder-val="{{false}}">

</sc-if>
<div style="display:flex;align-items:center;gap:8px;position:relative">
<a href="Settings.dc.html" aria-label="Back to Settings" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#F2F2F3;margin-left:-10px"><svg width="22" height="22" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"></path></svg></a>
<h1 style="margin:0;font-size:28px;font-weight:600;letter-spacing:-0.02em">Your car</h1>
</div>

<sc-if value="{{notPhoto}}" hint-placeholder-val="{{true}}">
<div role="group" aria-roledescription="carousel" aria-label="Body shape" onPointerDown="{{down}}" onPointerMove="{{move}}" onPointerUp="{{up}}" onPointerCancel="{{up}}" style="margin:6px -20px 0;height:156px;flex:none;overflow:hidden;position:relative;touch-action:pan-y;cursor:grab;user-select:none">
<div style="display:flex;width:1950px;height:156px;align-items:center;transform:translateX({{tx}});transition:{{tt}}">
<sc-for list="{{slides}}" as="sl" hint-placeholder-count="5">
<div style="width:390px;flex:none;box-sizing:border-box;padding:0 8px;opacity:{{sl.op}};transition:opacity 300ms">
<dc-import name="Car" model="{{sl.model}}" look="{{look}}" paint="{{paint}}" hint-size="374px,145px"></dc-import>
</div>
</sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{isPhoto}}" hint-placeholder-val="{{false}}">

<span style="font-size:13px;color:#A1A1A8">From /car/image</span>

<sc-for list="{{facts}}" as="f" hint-placeholder-count="3">

<div style="flex:1"></div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0, dx: 0, dragging: false, look: 0, lookDrag: null, paint: 0, scrub: false, name: 'HR-V e:HEV', toast: false, toastText: 'Saved' };
  }
  frac(e, n) {
    const r = this.rect;
    return Math.max(0, Math.min(n - 1, ((e.clientX - r.left) / r.width) * n - 0.5));
  }
  grab(e) {
    e.currentTarget.setPointerCapture(e.pointerId);
    this.rect = e.currentTarget.getBoundingClientRect();
  }
  saved(text) {
    // Autosave: every committed change shows one short toast; a new one replaces the old.
    clearTimeout(this.tt);
    this.setState({ toast: false });
    setTimeout(() => this.setState({ toast: true, toastText: text || 'Saved' }), 0);
    this.tt = setTimeout(() => this.setState({ toast: false }), 1600);
  }
  renderVals() {
    const s = this.state;
    const models = [['crossover', 'HR-V'], ['city', 'City'], ['sedan', 'Civic'], ['suv', 'CR-V'], ['mpv', 'BR-V']];
    const looks = ['Shaded', 'Line', 'Photo'];
    const paints = [
      ['Meteoroid Gray', '#6B7078'], ['Platinum White', '#E9E9E6'], ['Crystal Black', '#15171A'],
      ['Ignite Red', '#9E1B22'], ['Lunar Silver', '#B8BCC2'], ['Obsidian Blue', '#1F2F4A'],
    ];
    const lookPos = s.lookDrag ?? s.look;
    const edge = (s.i === 0 && s.dx > 0) || (s.i === models.length - 1 && s.dx < 0);
    const dx = edge ? s.dx * 0.35 : s.dx;
    return {
      slides: models.map(([model], k) => ({ model, op: k === s.i ? 1 : 0.35 })),
      tx: (-s.i * 390 + dx) + 'px',
      tt: s.dragging ? 'none' : 'transform 420ms cubic-bezier(.22,1,.36,1)',
      modelName: models[s.i][1],
      dots: models.map((m, k) => ({ w: k === s.i ? '20px' : '6px', c: k === s.i ? '#F2F2F3' : '#3A3A40' })),
      look: s.look === 1 ? 'line' : 'shaded',
      isPhoto: s.look === 2,
      notPhoto: s.look !== 2,
      paint: s.look === 1 && s.paint === 0 ? '#7CC7FF' : paints[s.paint][1],
      looks,
      lookIndex: s.look,
      lookName: looks[s.look],
      lookX: 'calc(' + lookPos + ' * 100%)',
      lookT: s.lookDrag == null ? 'transform 320ms cubic-bezier(.34,1.56,.64,1)' : 'none',
      paintIndex: s.paint,
      paintName: paints[s.paint][0],
      paints: paints.map(([name, hex], k) => ({
        hex,
        scale: k === s.paint ? (s.scrub ? 1.3 : 1.15) : 1,
        ring: k === s.paint ? '0 0 0 3px #121214, 0 0 0 5px #7CC7FF' : 'inset 0 0 0 1px rgba(255,255,255,.18)',
      })),
      down: (e) => { this.grab(e); this.x0 = e.clientX; this.setState({ dragging: true, dx: 0 }); },
      move: (e) => { if (this.state.dragging) this.setState({ dx: e.clientX - this.x0 }); },
      up: () => {
        if (!this.state.dragging) return;
        const d = this.state.dx;
        const i = Math.max(0, Math.min(4, this.state.i + (d < -60 ? 1 : d > 60 ? -1 : 0)));
        this.setState({ dragging: false, dx: 0, i });
        if (i !== this.state.i) this.saved();
      },
      lookDown: (e) => { this.grab(e); const f = this.frac(e, 3); this.setState({ lookDrag: f, look: Math.round(f) }); },
      lookMove: (e) => { if (this.state.lookDrag != null) { const f = this.frac(e, 3); this.setState({ lookDrag: f, look: Math.round(f) }); } },
      paintDown: (e) => { this.grab(e); this.setState({ scrub: true, paint: Math.round(this.frac(e, 6)) }); },

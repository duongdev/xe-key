<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Car states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:1500px;height:560px;box-sizing:border-box;background:#0B0B0C;color:#F2F2F3;font-family:'Be Vietnam Pro',-apple-system,system-ui,sans-serif;padding:40px;display:flex;flex-direction:column;gap:20px">
<div style="display:flex;align-items:baseline;gap:16px">
<span style="font-size:24px;font-weight:600;letter-spacing:-0.02em">Car states</span>
<span style="font-size:15px;color:#A1A1A8">The picture mirrors the real car. Only confirmed state changes it, never a pending command.</span>
</div>
<div style="flex:1;display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:20px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
<div style="border-radius:24px;background:#141416;padding:20px 8px 18px;display:flex;flex-direction:column;gap:6px">
<div style="flex:1;display:flex;align-items:center">
<div style="width:100%">
<dc-import name="Car" model="city" paint="#B8BCC2" doors="{{t.doors}}" engine="{{t.engine}}" hint-size="100%,130px"></dc-import>
</div>
</div>
<span style="padding:0 12px;font-size:15px;font-weight:600;color:{{t.color}}">{{t.title}}</span>
<span style="padding:0 12px;font-size:13px;line-height:19px;color:#A1A1A8">{{t.sub}}</span>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1500,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      tiles: [
        { doors: 'locked', engine: false, color: '#F2F2F3', title: 'Locked · off', sub: 'Default. Quiet: no lights, no motion.' },
        { doors: 'unlocked', engine: false, color: '#FFB547', title: 'Unlocked', sub: 'Indicators blink twice like the real car, then mirror lamps and handles stay amber.' },
        { doors: 'locked', engine: true, color: '#7CC7FF', title: 'Engine on', sub: 'Headlights and tail lights glow, exhaust puffs drift back every 0.9 s.' },
        { doors: 'unlocked', engine: true, color: '#FFB547', title: 'Engine on · unlocked', sub: 'Both cues together. Home headline shows the amber state first.' },
      ],
    };
  }
}
</script>
</body>
</html>

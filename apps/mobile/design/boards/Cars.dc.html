<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Car switcher</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#050505;color:#F2F2F3;font-family:'Be Vietnam Pro',-apple-system,system-ui,sans-serif;position:relative;overflow:hidden">
<div style="position:absolute;inset:0;padding:62px 20px;opacity:.35">
<span style="font-size:15px;font-weight:600">HR-V e:HEV</span>
<h1 style="margin:40px 0 0;font-size:40px;font-weight:600;letter-spacing:-0.03em">Locked</h1>
</div>

<div style="position:absolute;left:0;right:0;bottom:0;background:#17171A;border-radius:28px 28px 0 0;padding:12px 20px 30px;display:flex;flex-direction:column;gap:14px">
<span style="align-self:center;width:36px;height:5px;border-radius:3px;background:#2E2E33"></span>
<div style="display:flex;align-items:center;justify-content:space-between">
<h2 style="margin:0;font-size:22px;font-weight:600;letter-spacing:-0.02em">Your cars</h2>
<a href="Main.dc.html" style="min-height:44px;display:flex;align-items:center;font-size:15px;color:#7CC7FF;text-decoration:none">Done</a>
</div>

<sc-for list="{{cars}}" as="c" hint-placeholder-count="3">
<a href="Main.dc.html" style="display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;background:{{c.bg}};box-shadow:{{c.ring}};color:#F2F2F3;text-decoration:none">
<div style="width:64px;height:44px;border-radius:12px;background:#232327;display:flex;align-items:center;justify-content:center;flex:none">
<svg width="40" height="24" viewBox="0 0 40 24" aria-hidden="true"><path d="M2 17v-3c0-1.5 1-2.5 3-2.6l6-.7c2.5-3 5-5 9-5h7c3 0 5 1.6 7 4l2.5.6c1.6.4 2.5 1.4 2.5 3V17z" fill="#3A3A40"></path><circle cx="10" cy="17" r="3.5" fill="#17171A"></circle><circle cx="30" cy="17" r="3.5" fill="#17171A"></circle></svg>
</div>
<div style="flex:1;display:flex;flex-direction:column;gap:3px;min-width:0">
<span style="font-size:16px;font-weight:600">{{c.name}}</span>
<span style="font-size:13px;color:{{c.subColor}}">{{c.sub}}</span>
<span style="font-size:12px;color:#A1A1A8">{{c.owner}}</span>
</div>
</a>
</sc-for>

<a href="#" style="min-height:56px;border-radius:20px;box-shadow:inset 0 0 0 1px #2E2E33;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;color:#F2F2F3;text-decoration:none">
<svg width="18" height="18" aria-hidden="true" viewBox="0 0 256 256" fill="currentColor"><path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"></path></svg>
Add a car</a>
<span style="font-size:13px;color:#A1A1A8;text-align:center">Tip: swipe the car on Home to switch</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      cars: [
        { name: 'HR-V e:HEV', sub: 'Locked · 62% · Landmark 81', owner: 'Yours', subColor: '#A1A1A8', bg: '#232327', ring: 'inset 0 0 0 2px #7CC7FF' },
        { name: 'City RS', sub: 'Unlocked · 18 min', owner: 'Shared by Lan · lock & location', subColor: '#FFB547', bg: 'transparent', ring: 'inset 0 0 0 1px #2E2E33' },
        { name: 'CR-V', sub: 'Asleep · last seen 2 days ago', owner: 'Yours', subColor: '#A1A1A8', bg: 'transparent', ring: 'inset 0 0 0 1px #2E2E33' },
      ],
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Alerts glass</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.g{background:rgba(38,38,44,.52);-webkit-backdrop-filter:blur(18px) saturate(1.8);backdrop-filter:blur(18px) saturate(1.8);box-shadow:inset 0 .75px 0 rgba(255,255,255,.22),inset 0 0 0 .75px rgba(255,255,255,.09),0 8px 28px rgba(0,0,0,.38)}
.gl{background:rgba(255,255,255,.58);-webkit-backdrop-filter:blur(18px) saturate(1.8);backdrop-filter:blur(18px) saturate(1.8);box-shadow:inset 0 .75px 0 rgba(255,255,255,.95),inset 0 0 0 .75px rgba(0,0,0,.06),0 6px 22px rgba(0,0,0,.12)}
.gm{background:rgba(28,28,32,.46);-webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);box-shadow:inset 0 .75px 0 rgba(255,255,255,.24),inset 0 0 0 .75px rgba(255,255,255,.10),0 6px 20px rgba(0,0,0,.45)}
.gf{background:#232327;box-shadow:inset 0 0 0 .75px rgba(255,255,255,.06),0 8px 24px rgba(0,0,0,.45)}
.ttl{font-size:22px;font-weight:600;letter-spacing:-0.02em}
.cap{font-size:12px;color:#A1A1A8}
.seg{position:relative;z-index:1;height:40px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:500;border-radius:20px;transition:color 150ms,transform 120ms cubic-bezier(.22,1,.36,1);white-space:nowrap}
.seg:active{transform:scale(.94)}
.badge{min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;background:#FFB547;color:#1A1000;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.lens{position:absolute;top:4px;height:40px;border-radius:20px}
.row{min-height:64px;padding:0 20px;display:flex;align-items:center;gap:12px;box-shadow:inset 0 1px 0 #1F1F23}
.chip{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;flex:none}
.circ{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;flex:none}
.noscroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0B0B0C;color:#F2F2F3;font-family:'Be Vietnam Pro',-apple-system,system-ui,sans-serif;position:relative;overflow:hidden">
<div class="noscroll" style="position:absolute;inset:0;overflow-y:auto;padding:112px 0 120px">
<sc-for list="{{groups}}" as="grp" hint-placeholder-count="2">
<span style="display:block;padding:14px 20px 6px;font-size:13px;color:#A1A1A8">{{grp.name}}</span>
<sc-for list="{{grp.items}}" as="n" hint-placeholder-count="3">
<div class="row">
<span class="chip" style="background:{{n.bg}};color:{{n.c}}"><svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="{{n.d}}"></path></svg></span>
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
<span style="font-size:15px;font-weight:{{n.w}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{n.t}}</span>
<sc-if value="{{n.hasSub}}" hint-placeholder-val="{true}"><span style="font-size:13px;color:#A1A1A8">{{n.sub}}</span></sc-if>
</span>
<span style="display:flex;align-items:center;gap:8px;font-size:13px;color:#A1A1A8;font-variant-numeric:tabular-nums;white-space:nowrap">
<sc-if value="{{n.dot}}" hint-placeholder-val="{false}"><span aria-label="Unread" style="width:8px;height:8px;border-radius:4px;background:#FFB547"></span></sc-if>
{{n.time}}</span>
</div>
</sc-for>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{false}">
<div style="height:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0 48px;text-align:center">
<span class="chip" style="width:64px;height:64px;border-radius:32px;background:#17171A;color:{{emptyC}}"><svg width="28" height="28" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="{{emptyD}}"></path></svg></span>
<span style="font-size:17px;font-weight:600">{{emptyT}}</span>
<span style="font-size:15px;color:#A1A1A8;line-height:21px">{{emptyB}}</span>
</div>
</sc-if>
</div>

<div style="position:absolute;left:0;right:0;top:0;height:112px;background:linear-gradient(#0B0B0C 62%,rgba(11,11,12,0));pointer-events:none"></div>
<div style="position:absolute;left:16px;right:16px;top:56px;display:flex;align-items:center;gap:12px">

<button onClick="{{markRead}}" aria-label="Mark all read" class="circ g" style="border:0;color:{{markC}};cursor:pointer;transition:color 200ms"><svg width="22" height="22" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" style="flex:none"><path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"></path></svg></button>
</div>

<div style="position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(rgba(11,11,12,0),rgba(11,11,12,.7));pointer-events:none"></div>
<div role="tablist" aria-label="Filter alerts" onPointerDown="{{down}}" onPointerMove="{{move}}" onPointerUp="{{up}}" onPointerCancel="{{up}}" class="g" style="position:absolute;bottom:30px;left:50%;transform:translateX(-50%) scale({{barScale}});transition:transform 220ms cubic-bezier(.34,1.56,.64,1);height:48px;box-sizing:border-box;padding:4px;border-radius:24px;display:flex;touch-action:none;user-select:none;cursor:pointer">
<span class="lens" style="left:{{lensX}};width:{{lensW}};background:{{lensBg}};transition:left 320ms cubic-bezier(.34,1.56,.64,1),width 320ms cubic-bezier(.34,1.56,.64,1),background 150ms"></span>
<sc-for list="{{segs}}" as="s" hint-placeholder-count="3">
<span role="tab" aria-selected="{{s.sel}}" class="seg" style="width:{{s.w}};color:{{s.c}};font-weight:{{s.fw}}">{{s.label}}<sc-if value="{{s.hasBadge}}" hint-placeholder-val="{false}"><span class="badge" style="transform:scale({{s.bs}});transition:transform 200ms cubic-bezier(.34,1.56,.64,1)">{{s.n}}</span></sc-if></span>
</sc-for>
</div>
</div>
</x-dc>

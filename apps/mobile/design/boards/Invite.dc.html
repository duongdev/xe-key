<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invite someone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0B0B0C;color:#F2F2F3;font-family:'Be Vietnam Pro',-apple-system,system-ui,sans-serif;padding:56px 20px 30px;display:flex;flex-direction:column;gap:18px;overflow:hidden">
<div style="display:flex;align-items:center;justify-content:space-between">
<a href="Share.dc.html" style="min-height:44px;display:flex;align-items:center;font-size:15px;color:#7CC7FF;text-decoration:none">Cancel</a>
<span style="font-size:15px;font-weight:600">Invite</span>
<span style="width:52px"></span>
</div>

<label style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:#A1A1A8">Name
<input type="text" value="Minh" style="height:52px;box-sizing:border-box;border:0;border-radius:14px;background:#17171A;color:#F2F2F3;padding:0 16px;font:inherit;font-size:17px">
</label>

<div style="display:flex;flex-direction:column;gap:8px">
<span style="font-size:13px;color:#A1A1A8;padding-left:4px">They can</span>
<div style="background:#17171A;border-radius:20px;padding:0 16px">
<sc-for list="{{perms}}" as="p" hint-placeholder-count="4">
<label style="min-height:56px;display:flex;align-items:center;gap:12px;box-shadow:{{p.sep}}">
<span style="flex:1;display:flex;flex-direction:column;gap:2px">
<span style="font-size:15px;color:#F2F2F3">{{p.k}}</span>
<span style="font-size:12px;color:#A1A1A8">{{p.note}}</span>
</span>
<input type="checkbox" checked="{{p.on}}" style="width:22px;height:22px;accent-color:#7CC7FF">
</label>
</sc-for>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<span id="exp" style="font-size:13px;color:#A1A1A8;padding-left:4px">Access ends</span>
<div role="group" aria-labelledby="exp" style="display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:4px;padding:4px;border-radius:16px;background:#17171A">
<button style="height:40px;border:0;border-radius:12px;background:transparent;color:#A1A1A8;font:inherit;font-size:14px">1 day</button>
<button aria-pressed="true" style="height:40px;border:0;border-radius:12px;background:#2A2A2F;color:#F2F2F3;font:inherit;font-size:14px;font-weight:600">1 month</button>
<button style="height:40px;border:0;border-radius:12px;background:transparent;color:#A1A1A8;font:inherit;font-size:14px">Date…</button>
<button style="height:40px;border:0;border-radius:12px;background:transparent;color:#A1A1A8;font:inherit;font-size:14px">Never</button>
</div>
</div>

<div style="flex:1"></div>
<p style="margin:0;font-size:13px;line-height:19px;color:#A1A1A8;text-align:center">Minh opens the link in this app and signs in. You get a notice each time a shared person unlocks or starts the car.</p>
<button style="height:68px;border:0;border-radius:34px;background:#7CC7FF;color:#06121C;font:inherit;font-size:17px;font-weight:600">Share invite link</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      perms: [
        ['See location & status', 'Always on', true],
        ['Lock', '', true],
        ['Unlock', 'Needs Face ID on their phone', false],
        ['Start engine', 'Uses your 2-start limit', false],
      ].map(([k, note, on], i) => ({ k, note, on, sep: i ? 'inset 0 1px 0 #26262A' : 'none' })),
    };
  }
}
</script>
</body>
</html>

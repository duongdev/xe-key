<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"engine":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lock: 'locked', step: '', holding: false, waking: false, fresh: false, doneMsg: '' };
    this.timers = [];
  }
  componentDidMount() {
    this.tick = setInterval(() => {
      if (this.props.engine === true) this.setState({ left: ((this.state.left ?? 522) + 599) % 600 });
    }, 1000);
  }
  componentWillUnmount() { this.timers.forEach(clearTimeout); clearTimeout(this.holdT); clearInterval(this.tick); }
  later(ms, fn) { this.timers.push(setTimeout(fn, ms)); }
  run(to, final) {
    this.setState({ lock: to, step: 'Sending', doneMsg: '' });
    this.later(700, () => this.setState({ step: 'Accepted' }));
    this.later(2600, () => this.setState({ lock: final, step: '', doneMsg: final === 'locked' ? 'Locked' : 'Unlocked' }));
    this.later(5200, () => this.setState({ doneMsg: '' }));
  }
  renderVals() {
    const light = (this.props.theme ?? 'dark') === 'light';
    const t = light
      ? { bg: '#F4F4F6', s1: '#FFFFFF', s2: '#E6E6EB', fg: '#0B0B0C', fg2: '#5C5C63', line: '#D6D6DC', acc: '#0A6FC2', warn: '#9A5200', onwarn: '#FFFFFF' }
      : { bg: '#0B0B0C', s1: '#17171A', s2: '#232327', fg: '#F2F2F3', fg2: '#A1A1A8', line: '#2E2E33', acc: '#7CC7FF', warn: '#FFB547', onwarn: '#1A1000' };
    const vars = Object.keys(t).map((k) => '--' + k + ':' + t[k] + ';').join('');
    const s = this.state;
    const pending = s.lock === 'unlocking' || s.lock === 'locking';
    const labels = { locked: 'Hold to unlock', unlocking: 'Unlocking', unlocked: 'Lock', locking: 'Locking' };
    const heads = { locked: 'Locked', unlocking: 'Locked', unlocked: 'Unlocked', locking: 'Unlocked' };
    const isUnlocked = s.lock === 'unlocked';
    const on = this.props.engine === true;
    const left = s.left ?? 522;
    const clock = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
    return {
      vars,
      ground: light ? 'light' : 'dark',
      carDoors: s.lock === 'unlocked' || s.lock === 'locking' ? 'unlocked' : 'locked',
      engineOn: on,
      engineChip: on ? clock : 'Off',
      engineAria: on ? 'Engine on, ' + clock + ' left' : 'Engine off',
      engineColor: on ? 'var(--acc)' : 'var(--fg)',
      cabinAria: on ? 'Cabin 34 degrees, cooling' : 'Cabin 34 degrees, warm',
      tempDot: on ? 'var(--acc)' : 'var(--warn)',
      startLabel: on ? clock : 'Start',
      startAria: on ? 'Engine running, ' + clock + ' left. Open climate' : 'Start engine and cool. Opens climate',
      startBg: on ? 'var(--s2)' : 'var(--s1)',
      startRing: on ? 'inset 0 0 0 2px var(--acc)' : 'none',
      headline: heads[s.lock],
      headColor: s.lock === 'unlocked' || s.lock === 'locking' ? 'var(--warn)' : 'var(--fg)',
      freshness: s.waking ? 'Waking' : s.fresh ? 'Live' : '2m',
      freshColor: s.fresh && !s.waking ? 'var(--acc)' : 'var(--fg2)',
      freshAria: s.waking ? 'Waking car' : s.fresh ? 'Live data. Tap to refresh' : 'Updated 2 minutes ago. Tap or pull down to wake the car',
      waking: s.waking,
      notWaking: !s.waking,
      pending,
      done: !!s.doneMsg,
      statusLine: s.step || s.doneMsg || '',
      btnLabel: labels[s.lock],
      btnBg: isUnlocked ? 'var(--warn)' : 'var(--s1)',
      btnFg: isUnlocked ? 'var(--onwarn)' : 'var(--fg)',

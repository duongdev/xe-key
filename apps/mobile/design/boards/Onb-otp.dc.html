<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SMS code</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0B0B0C;color:#F2F2F3;font-family:'Be Vietnam Pro',-apple-system,system-ui,sans-serif;display:flex;flex-direction:column;padding:56px 20px 0">
<div style="display:flex;align-items:center;gap:12px">
<a href="Onb-device.dc.html" aria-label="Back" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#F2F2F3;margin-left:-10px">
<svg width="22" height="22" aria-hidden="true" viewBox="0 0 256 256" fill="currentColor"><path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"></path></svg>
</a>
<div style="flex:1;display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:6px" aria-label="Step 3 of 4">
<span style="height:4px;border-radius:2px;background:#7CC7FF"></span><span style="height:4px;border-radius:2px;background:#7CC7FF"></span><span style="height:4px;border-radius:2px;background:#7CC7FF"></span><span style="height:4px;border-radius:2px;background:#2A2A2F"></span>
</div>
<span style="width:34px"></span>
</div>

<div style="margin-top:28px;width:56px;height:56px;border-radius:16px;background:#17171A;display:flex;align-items:center;justify-content:center"><svg width="28" height="28" viewBox="0 0 256 256" fill="#7CC7FF" aria-hidden="true"><path d="M216,48H40A16,16,0,0,0,24,64V224a15.85,15.85,0,0,0,9.24,14.5A16.13,16.13,0,0,0,40,240a15.89,15.89,0,0,0,10.25-3.78l.09-.07L83,208H216a16,16,0,0,0,16-16V64A16,16,0,0,0,216,48ZM40,224h0ZM216,192H80a8,8,0,0,0-5.23,1.95L40,224V64H216ZM88,112a8,8,0,0,1,8-8h64a8,8,0,0,1,0,16H96A8,8,0,0,1,88,112Zm0,32a8,8,0,0,1,8-8h64a8,8,0,1,1,0,16H96A8,8,0,0,1,88,144Z"></path></svg></div>
<h1 style="margin:16px 0 8px;font-size:34px;line-height:40px;font-weight:600;letter-spacing:-0.02em">Enter the code</h1>
<p style="margin:0 0 28px;font-size:15px;color:#A1A1A8">Sent to •••• 4567</p>

<div style="display:grid;grid-template-columns:repeat(6, minmax(0, 1fr));gap:8px" aria-label="Verification code">
<sc-for list="{{boxes}}" as="b" hint-placeholder-count="6">
<span style="height:60px;border-radius:14px;background:#17171A;box-shadow:{{b.ring}};display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums">{{b.d}}</span>
</sc-for>
</div>

<div style="margin-top:18px;min-height:44px;display:flex;align-items:center;gap:8px;font-size:15px;color:#A1A1A8">
<sc-if value="{{verifying}}" hint-placeholder-val="{{false}}">
<svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="#A1A1A8" stroke-opacity=".3" stroke-width="2.5"></circle><path d="M10 2a8 8 0 0 1 8 8" fill="none" stroke="#7CC7FF" stroke-width="2.5" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 10 10" to="360 10 10" dur="0.9s" repeatCount="indefinite"></animateTransform></path></svg>
</sc-if>
<span aria-live="polite">{{status}}</span>
</div>

<div style="flex:1"></div>
<sc-if value="{{ok}}" hint-placeholder-val="{{false}}">
<a href="Onb-found.dc.html" style="margin-bottom:24px;height:64px;border-radius:32px;background:#7CC7FF;color:#06121C;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;text-decoration:none">Meet your car</a>
</sc-if>

<sc-if value="{{showKeyboard}}" hint-placeholder-val="{{true}}">
<div style="margin:0 -20px;background:#1C1C1F;padding:8px 8px 34px;display:flex;flex-direction:column;gap:8px">
<button onClick="{{autofill}}" style="height:44px;border:0;border-radius:10px;background:#2C2C30;color:#F2F2F3;font:inherit;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px">From Messages <span style="font-weight:600;letter-spacing:.08em">482 913</span></button>
<div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:6px">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
<span style="height:46px;border-radius:8px;background:{{k.bg}};display:flex;align-items:center;justify-content:center;font-size:24px">{{k.l}}</span>
</sc-for>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { code: '', verifying: false, ok: false, resend: 42 }; this.timers = []; }
  componentDidMount() { this.tick = setInterval(() => { if (this.state.resend > 0) this.setState({ resend: this.state.resend - 1 }); }, 1000); }
  componentWillUnmount() { clearInterval(this.tick); this.timers.forEach(clearTimeout); }
  renderVals() {
    const s = this.state;
    const code = s.code;
    return {
      boxes: [0, 1, 2, 3, 4, 5].map((i) => ({
        d: code[i] || '',
        ring: i === code.length && !s.verifying && !s.ok ? 'inset 0 0 0 2px #7CC7FF' : s.ok ? 'inset 0 0 0 2px #2F6F4F' : 'none',
      })),
      verifying: s.verifying,
      ok: s.ok,
      showKeyboard: !s.ok,
      status: s.ok ? 'Verified' : s.verifying ? 'Checking…' : s.resend > 0 ? 'Resend in 0:' + String(s.resend).padStart(2, '0') : 'Resend code',
      keys: ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'].map((l) => ({ l, bg: l && l !== '⌫' ? '#3A3A3E' : 'transparent' })),
      autofill: () => {
        if (s.code) return;
        '482913'.split('').forEach((c, i) => this.timers.push(setTimeout(() => this.setState({ code: this.state.code + c }), 70 * (i + 1))));
        this.timers.push(setTimeout(() => this.setState({ verifying: true }), 520));
        this.timers.push(setTimeout(() => this.setState({ verifying: false, ok: true }), 1700));
      },
    };
  }
}
</script>
</body>
</html>

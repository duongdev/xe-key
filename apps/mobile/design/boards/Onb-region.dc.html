<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose region</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0B0B0C;color:#F2F2F3;font-family:'Be Vietnam Pro',-apple-system,system-ui,sans-serif;display:flex;flex-direction:column;padding:56px 20px 30px">
<div style="display:flex;align-items:center;gap:12px">
<a href="Onb-welcome.dc.html" aria-label="Back" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#F2F2F3;margin-left:-10px">
<svg width="22" height="22" aria-hidden="true" viewBox="0 0 256 256" fill="currentColor"><path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"></path></svg>
</a>
<div style="flex:1;display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:6px" aria-label="Step 1 of 4">
<span style="height:4px;border-radius:2px;background:#7CC7FF"></span><span style="height:4px;border-radius:2px;background:#2A2A2F"></span><span style="height:4px;border-radius:2px;background:#2A2A2F"></span><span style="height:4px;border-radius:2px;background:#2A2A2F"></span>
</div>
<span style="width:34px"></span>
</div>

<h1 style="margin:28px 0 8px;font-size:34px;line-height:40px;font-weight:600;letter-spacing:-0.02em">Your car's country</h1>
<p style="margin:0 0 20px;display:flex;align-items:center;gap:8px;font-size:15px;color:#A1A1A8"><svg width="18" height="18" viewBox="0 0 256 256" fill="#A1A1A8" aria-hidden="true"><path d="M128,24h0A104,104,0,1,0,232,128,104.12,104.12,0,0,0,128,24Zm88,104a87.61,87.61,0,0,1-3.33,24H174.16a157.44,157.44,0,0,0,0-48h38.51A87.61,87.61,0,0,1,216,128ZM102,168H154a115.11,115.11,0,0,1-26,45A115.27,115.27,0,0,1,102,168Zm-3.9-16a140.84,140.84,0,0,1,0-48h59.88a140.84,140.84,0,0,1,0,48ZM40,128a87.61,87.61,0,0,1,3.33-24H81.84a157.44,157.44,0,0,0,0,48H43.33A87.61,87.61,0,0,1,40,128ZM154,88H102a115.11,115.11,0,0,1,26-45A115.27,115.27,0,0,1,154,88Zm52.33,0H170.71a135.28,135.28,0,0,0-22.3-45.6A88.29,88.29,0,0,1,206.37,88ZM107.59,42.4A135.28,135.28,0,0,0,85.29,88H49.63A88.29,88.29,0,0,1,107.59,42.4ZM49.63,168H85.29a135.28,135.28,0,0,0,22.3,45.6A88.29,88.29,0,0,1,49.63,168Zm98.78,45.6a135.28,135.28,0,0,0,22.3-45.6h35.66A88.29,88.29,0,0,1,148.41,213.6Z"></path></svg>As on your Honda contract</p>

<div role="radiogroup" aria-label="Region" style="background:#17171A;border-radius:20px;padding:0 16px">
<sc-for list="{{regions}}" as="r" hint-placeholder-count="8">
<div role="radio" aria-checked="{{r.on}}" tabindex="0" style="min-height:50px;display:flex;align-items:center;gap:12px;box-shadow:{{r.sep}}">
<span aria-hidden="true" style="width:34px;height:24px;border-radius:6px;background:{{r.badge}};color:{{r.badgeFg}};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;letter-spacing:.04em">{{r.code}}</span>
<span style="flex:1;font-size:16px;font-weight:{{r.w}}">{{r.name}}</span>
<sc-if value="{{r.sel}}" hint-placeholder-val="{{false}}">
<svg width="20" height="20" aria-hidden="true" viewBox="0 0 256 256" fill="#7CC7FF"><path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"></path></svg>
</sc-if>
</div>
</sc-for>
</div>

<div style="flex:1"></div>
<a href="Onb-signin.dc.html" style="height:64px;border-radius:32px;background:#F2F2F3;color:#0B0B0C;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;text-decoration:none">Continue</a>
<span style="margin-top:12px;font-size:12px;color:#A1A1A8;text-align:center">Auto-picked from your iPhone</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [
      ['Vietnam', 'VN'], ['Indonesia', 'ID'], ['Malaysia', 'MY'], ['Philippines', 'PH'],
      ['Taiwan', 'TW'], ['Korea', 'KR'], ['Australia', 'AU'], ['New Zealand', 'NZ'],
    ];
    return {
      regions: list.map(([name, code], i) => ({
        name, code, sel: i === 0, on: String(i === 0), w: i === 0 ? '600' : '400',
        badge: i === 0 ? '#7CC7FF' : '#232327', badgeFg: i === 0 ? '#06121C' : '#A1A1A8',
        sep: i ? 'inset 0 1px 0 #26262A' : 'none',
      })),
    };
  }
}
</script>
</body>
</html>

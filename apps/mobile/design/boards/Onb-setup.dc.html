<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick setup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0B0B0C;color:#F2F2F3;font-family:'Be Vietnam Pro',-apple-system,system-ui,sans-serif;display:flex;flex-direction:column;padding:96px 20px 30px">
<h1 style="margin:0 0 8px;font-size:34px;line-height:40px;font-weight:600;letter-spacing:-0.02em">Almost there</h1>
<p style="margin:0 0 28px;font-size:15px;color:#A1A1A8">All optional</p>

<div style="display:flex;flex-direction:column;gap:12px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="3">
<div style="display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;background:#17171A">
<div style="width:44px;height:44px;border-radius:12px;background:#232327;display:flex;align-items:center;justify-content:center;flex:none">
<svg width="22" height="22" aria-hidden="true" viewBox="0 0 256 256" fill="#7CC7FF"><path d="{{it.icon}}"></path></svg>
</div>
<div style="flex:1;display:flex;flex-direction:column;gap:2px;min-width:0">
<span style="font-size:16px;font-weight:600">{{it.t}}</span>
<span style="font-size:13px;color:#A1A1A8">{{it.s}}</span>
</div>
<button role="switch" aria-checked="{{it.on}}" aria-label="{{it.t}}" onClick="{{it.toggle}}" style="width:52px;height:44px;border:0;padding:0;background:none;cursor:pointer;flex:none;display:flex;align-items:center">
<span style="width:52px;height:32px;border-radius:16px;background:{{it.track}};position:relative;transition:background 200ms">
<span style="position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:#FFFFFF;transform:translateX({{it.knob}});transition:transform 250ms cubic-bezier(.34,1.56,.64,1)"></span>
</span>
</button>
</div>
</sc-for>
</div>

<div style="flex:1"></div>
<a href="Main.dc.html" style="height:64px;border-radius:32px;background:#7CC7FF;color:#06121C;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;text-decoration:none">Go to my car</a>
</div>
</x-dc>

</body>
</html>

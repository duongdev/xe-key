<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pick your car look</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0B0B0C;color:#F2F2F3;font-family:'Be Vietnam Pro',-apple-system,system-ui,sans-serif;display:flex;flex-direction:column;padding:56px 20px 30px;position:relative;overflow:hidden">
<div aria-hidden="true" style="position:absolute;left:-80px;right:-80px;top:120px;height:300px;background:radial-gradient(closest-side, rgba(255,255,255,.09), rgba(255,255,255,0))"></div>

<div style="display:flex;align-items:center;justify-content:space-between;position:relative">
<a href="Onb-found.dc.html" aria-label="Back" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#F2F2F3;margin-left:-10px">
<svg width="22" height="22" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"></path></svg>
</a>
<a href="Onb-setup.dc.html" style="min-height:44px;display:flex;align-items:center;font-size:15px;color:#A1A1A8;text-decoration:none">Skip</a>
</div>

<h1 style="margin:8px 0 0;font-size:30px;line-height:36px;font-weight:600;letter-spacing:-0.02em;position:relative">Make it yours</h1>

<sc-if value="{{notPhoto}}" hint-placeholder-val="{{true}}">
<div role="group" aria-roledescription="carousel" aria-label="Body shape" onPointerDown="{{down}}" onPointerMove="{{move}}" onPointerUp="{{up}}" onPointerCancel="{{up}}" style="margin:14px -20px 0;height:170px;overflow:hidden;position:relative;touch-action:pan-y;cursor:grab;user-select:none">
<div style="display:flex;width:1950px;height:170px;align-items:center;transform:translateX({{tx}});transition:{{tt}}">
<sc-for list="{{slides}}" as="sl" hint-placeholder-count="5">
<div style="width:390px;flex:none;box-sizing:border-box;padding:0 8px;opacity:{{sl.op}};transition:opacity 300ms">
<dc-import name="Car" model="{{sl.model}}" look="{{look}}" paint="{{paint}}" hint-size="374px,145px"></dc-import>
</div>
</sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{isPhoto}}" hint-placeholder-val="{{false}}">
<div style="margin-top:14px;height:170px;border-radius:20px;box-shadow:inset 0 0 0 1px #2E2E33;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center">
<span style="font-size:15px;font-weight:600">[Honda render of your car]</span>
<span style="font-size:13px;color:#A1A1A8">From /car/image</span>
</div>
</sc-if>

<div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-top:4px;position:relative">
<svg width="14" height="14" viewBox="0 0 256 256" fill="#5A5A60" aria-hidden="true"><path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"></path></svg>
<span aria-live="polite" style="font-size:17px;font-weight:600;min-width:64px;text-align:center">{{modelName}}</span>
<svg width="14" height="14" viewBox="0 0 256 256" fill="#5A5A60" aria-hidden="true"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"></path></svg>
</div>
<div style="display:flex;justify-content:center;gap:6px;margin-top:8px;position:relative">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="5">
<span style="height:6px;border-radius:3px;width:{{d.w}};background:{{d.c}};transition:width 250ms cubic-bezier(.22,1,.36,1)"></span>
</sc-for>
</div>
<span style="margin-top:6px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:#A1A1A8;position:relative"><svg width="14" height="14" viewBox="0 0 256 256" fill="#A1A1A8" aria-hidden="true"><path d="M216,140v36c0,25.59-8.49,42.85-8.85,43.58A8,8,0,0,1,200,224a7.9,7.9,0,0,1-3.57-.85,8,8,0,0,1-3.58-10.73c.06-.12,7.16-14.81,7.16-36.42V140a12,12,0,0,0-24,0v4a8,8,0,0,1-16,0V124a12,12,0,0,0-24,0v12a8,8,0,0,1-16,0V68a12,12,0,0,0-24,0V176a8,8,0,0,1-14.79,4.23l-18.68-30-.14-.23A12,12,0,1,0,41.6,162L70.89,212A8,8,0,1,1,57.08,220l-29.32-50a28,28,0,0,1,48.41-28.17L80,148V68a28,28,0,0,1,56,0V98.7a28,28,0,0,1,38.65,16.69A28,28,0,0,1,216,140Zm37.66-89.66-32-32a8,8,0,0,0-11.31,11.32L228.68,48H176a8,8,0,0,0,0,16h52.69L210.34,82.34a8,8,0,0,0,11.31,11.32l32-32A8,8,0,0,0,253.66,50.34Z"></path></svg>Swipe</span>

<div style="display:flex;flex-direction:column;gap:8px;margin-top:20px;position:relative">
<div style="display:flex;align-items:center;gap:6px;font-size:13px;color:#A1A1A8"><svg width="14" height="14" viewBox="0 0 256 256" fill="#A1A1A8" aria-hidden="true"><path d="M247.31,124.76c-.35-.79-8.82-19.58-27.65-38.41C194.57,61.26,162.88,48,128,48S61.43,61.26,36.34,86.35C17.51,105.18,9,124,8.69,124.76a8,8,0,0,0,0,6.5c.35.79,8.82,19.57,27.65,38.4C61.43,194.74,93.12,208,128,208s66.57-13.26,91.66-38.34c18.83-18.83,27.3-37.61,27.65-38.4A8,8,0,0,0,247.31,124.76ZM128,192c-30.78,0-57.67-11.19-79.93-33.25A133.47,133.47,0,0,1,25,128,133.33,133.33,0,0,1,48.07,97.25C70.33,75.19,97.22,64,128,64s57.67,11.19,79.93,33.25A133.46,133.46,0,0,1,231.05,128C223.84,141.46,192.43,192,128,192Zm0-112a48,48,0,1,0,48,48A48.05,48.05,0,0,0,128,80Zm0,80a32,32,0,1,1,32-32A32,32,0,0,1,128,160Z"></path></svg><span id="lb-look">Style</span></div>
<div role="slider" tabindex="0" aria-labelledby="lb-look" aria-valuemin="0" aria-valuemax="2" aria-valuenow="{{lookIndex}}" aria-valuetext="{{lookName}}" onPointerDown="{{lookDown}}" onPointerMove="{{lookMove}}" onPointerUp="{{scrubUp}}" onPointerCancel="{{scrubUp}}" style="position:relative;height:48px;border-radius:24px;background:#17171A;touch-action:none;user-select:none;cursor:grab">
<div style="position:absolute;inset:0;display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));pointer-events:none">
<sc-for list="{{looks}}" as="o" hint-placeholder-count="3">
<span style="display:flex;align-items:center;justify-content:center;font-size:14px;color:#A1A1A8">{{o}}</span>
</sc-for>
</div>
<span style="position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / 3);border-radius:20px;background:#F2F2F3;color:#0B0B0C;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;transform:translateX({{lookX}});transition:{{lookT}};pointer-events:none">{{lookName}}</span>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:10px;margin-top:20px;position:relative">
<div style="display:flex;align-items:center;gap:6px;font-size:13px;color:#A1A1A8"><svg width="14" height="14" viewBox="0 0 256 256" fill="#A1A1A8" aria-hidden="true"><path d="M174,47.75a254.19,254.19,0,0,0-41.45-38.3,8,8,0,0,0-9.18,0A254.19,254.19,0,0,0,82,47.75C54.51,79.32,40,112.6,40,144a88,88,0,0,0,176,0C216,112.6,201.49,79.32,174,47.75ZM128,216a72.08,72.08,0,0,1-72-72c0-57.23,55.47-105,72-118,16.53,13,72,60.75,72,118A72.08,72.08,0,0,1,128,216Zm55.89-62.66a57.6,57.6,0,0,1-46.56,46.55A8.75,8.75,0,0,1,136,200a8,8,0,0,1-1.32-15.89c16.57-2.79,30.63-16.85,33.44-33.45a8,8,0,0,1,15.78,2.68Z"></path></svg><span id="lb-paint">{{paintName}}</span></div>
<div role="slider" tabindex="0" aria-labelledby="lb-paint" aria-valuemin="0" aria-valuemax="5" aria-valuenow="{{paintIndex}}" aria-valuetext="{{paintName}}" onPointerDown="{{paintDown}}" onPointerMove="{{paintMove}}" onPointerUp="{{scrubUp}}" onPointerCancel="{{scrubUp}}" style="position:relative;height:56px;display:grid;grid-template-columns:repeat(6, minmax(0, 1fr));align-items:center;justify-items:center;border-radius:28px;background:#121214;touch-action:none;user-select:none;cursor:grab">
<sc-for list="{{paints}}" as="p" hint-placeholder-count="6">
<span style="width:34px;height:34px;border-radius:17px;background:{{p.hex}};box-shadow:{{p.ring}};transform:scale({{p.scale}});transition:transform 180ms cubic-bezier(.34,1.56,.64,1)"></span>
</sc-for>
</div>
</div>

<div style="flex:1"></div>
<a href="Onb-setup.dc.html" style="height:64px;border-radius:32px;background:#F2F2F3;color:#0B0B0C;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;text-decoration:none;position:relative">Looks right</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0, dx: 0, dragging: false, look: 0, lookDrag: null, paint: 0, scrub: false };
  }
  frac(e, n) {
    const r = this.rect;
    return Math.max(0, Math.min(n - 1, ((e.clientX - r.left) / r.width) * n - 0.5));
  }
  grab(e) {
    e.currentTarget.setPointerCapture(e.pointerId);
    this.rect = e.currentTarget.getBoundingClientRect();
  }
  renderVals() {
    const s = this.state;
    const models = [['crossover', 'HR-V'], ['city', 'City'], ['sedan', 'Civic'], ['suv', 'CR-V'], ['mpv', 'BR-V']];
    const looks = ['Shaded', 'Line', 'Photo'];
    const paints = [
      ['Meteoroid Gray', '#6B7078'], ['Platinum White', '#E9E9E6'], ['Crystal Black', '#15171A'],
      ['Ignite Red', '#9E1B22'], ['Lunar Silver', '#B8BCC2'], ['Obsidian Blue', '#1F2F4A'],
    ];
    const lookPos = s.lookDrag ?? s.look;
    const edge = (s.i === 0 && s.dx > 0) || (s.i === models.length - 1 && s.dx < 0);
    const dx = edge ? s.dx * 0.35 : s.dx;
    return {
      slides: models.map(([model], k) => ({ model, op: k === s.i ? 1 : 0.35 })),
      tx: (-s.i * 390 + dx) + 'px',
      tt: s.dragging ? 'none' : 'transform 420ms cubic-bezier(.22,1,.36,1)',
      modelName: models[s.i][1],
      dots: models.map((m, k) => ({ w: k === s.i ? '20px' : '6px', c: k === s.i ? '#F2F2F3' : '#3A3A40' })),
      look: s.look === 1 ? 'line' : 'shaded',
      isPhoto: s.look === 2,
      notPhoto: s.look !== 2,
      paint: s.look === 1 && s.paint === 0 ? '#7CC7FF' : paints[s.paint][1],
      looks,
      lookIndex: s.look,
      lookName: looks[s.look],
      lookX: 'calc(' + lookPos + ' * 100%)',
      lookT: s.lookDrag == null ? 'transform 320ms cubic-bezier(.34,1.56,.64,1)' : 'none',
      paintIndex: s.paint,
      paintName: paints[s.paint][0],
      paints: paints.map(([name, hex], k) => ({
        hex,
        scale: k === s.paint ? (s.scrub ? 1.3 : 1.15) : 1,
        ring: k === s.paint ? '0 0 0 3px #121214, 0 0 0 5px #7CC7FF' : 'inset 0 0 0 1px rgba(255,255,255,.18)',
      })),
      down: (e) => { this.grab(e); this.x0 = e.clientX; this.setState({ dragging: true, dx: 0 }); },
      move: (e) => { if (this.state.dragging) this.setState({ dx: e.clientX - this.x0 }); },
      up: () => {
        if (!this.state.dragging) return;
        const d = this.state.dx;
        const i = Math.max(0, Math.min(4, this.state.i + (d < -60 ? 1 : d > 60 ? -1 : 0)));
        this.setState({ dragging: false, dx: 0, i });
      },
      lookDown: (e) => { this.grab(e); const f = this.frac(e, 3); this.setState({ lookDrag: f, look: Math.round(f) }); },
      lookMove: (e) => { if (this.state.lookDrag != null) { const f = this.frac(e, 3); this.setState({ lookDrag: f, look: Math.round(f) }); } },
      paintDown: (e) => { this.grab(e); this.setState({ scrub: true, paint: Math.round(this.frac(e, 6)) }); },
      paintMove: (e) => { if (this.state.scrub) this.setState({ paint: Math.round(this.frac(e, 6)) }); },
      scrubUp: () => this.setState({ lookDrag: null, scrub: false }),
    };
  }
}
</script>
</body>
</html>

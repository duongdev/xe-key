<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trips</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0B0B0C;color:#F2F2F3;font-family:'Be Vietnam Pro',-apple-system,system-ui,sans-serif;padding:56px 20px 30px;display:flex;flex-direction:column;gap:14px;overflow:hidden">
<div style="display:flex;align-items:center;gap:8px">
<a href="Main.dc.html" aria-label="Back to car" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#F2F2F3;margin-left:-10px"><svg width="22" height="22" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"></path></svg></a>
<h1 style="flex:1;margin:0;font-size:28px;font-weight:600;letter-spacing:-0.02em">Trips</h1>
<span style="height:28px;padding:0 10px;border-radius:14px;background:#17171A;display:flex;align-items:center;gap:6px;font-size:13px;color:#A1A1A8"><svg width="14" height="14" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M200,168a32.06,32.06,0,0,0-31,24H72a32,32,0,0,1,0-64h96a40,40,0,0,0,0-80H72a8,8,0,0,0,0,16h96a24,24,0,0,1,0,48H72a48,48,0,0,0,0,96h97a32,32,0,1,0,31-40Zm0,48a16,16,0,1,1,16-16A16,16,0,0,1,200,216Z"></path></svg> 6</span>
<span style="height:28px;padding:0 10px;border-radius:14px;background:#17171A;display:flex;align-items:center;gap:6px;font-size:13px;color:#A1A1A8"><svg width="14" height="14" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M235.92,199A8,8,0,0,1,225,195.92L155.32,72H136v8a8,8,0,0,1-16,0V72H100.68L31,195.92A8,8,0,0,1,17,188.08L82.32,72H24a8,8,0,0,1,0-16H232a8,8,0,0,1,0,16H173.68L239,188.08A8,8,0,0,1,235.92,199ZM128,112a8,8,0,0,0-8,8v16a8,8,0,0,0,16,0V120A8,8,0,0,0,128,112Zm0,56a8,8,0,0,0-8,8v16a8,8,0,0,0,16,0V176A8,8,0,0,0,128,168Z"></path></svg> 142 km</span>
</div>

<div role="img" aria-label="Distance per day this week: {{weekLabel}}" style="padding:14px 16px 12px;border-radius:20px;background:#17171A;display:grid;grid-template-columns:repeat(7, minmax(0, 1fr));gap:8px;align-items:end;height:116px;box-sizing:border-box">
<sc-for list="{{week}}" as="w" hint-placeholder-count="7">
<div style="display:flex;flex-direction:column;align-items:center;gap:6px">
<span style="width:100%;max-width:22px;height:{{w.h}};border-radius:6px;background:{{w.c}};display:block"></span>
<span style="font-size:12px;color:{{w.lc}}">{{w.d}}</span>
</div>
</sc-for>
</div>

<div style="padding:16px;border-radius:20px;background:#17171A;display:flex;gap:16px;align-items:center">
<div style="position:relative;width:88px;height:88px;flex:none">
<svg width="88" height="88" viewBox="0 0 88 88" role="img" aria-label="Driving score 86 of 100, up 4"><circle cx="44" cy="44" r="36" fill="none" stroke="#2A2A2F" stroke-width="7"></circle><circle cx="44" cy="44" r="36" fill="none" stroke="#7CC7FF" stroke-width="7" stroke-linecap="round" stroke-dasharray="226.2" stroke-dashoffset="31.7" transform="rotate(-90 44 44)"></circle></svg>
<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
<span style="font-size:26px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums">86</span>
<span style="display:flex;align-items:center;gap:2px;font-size:12px;color:#7CC7FF"><svg width="12" height="12" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M240,56v64a8,8,0,0,1-16,0V75.31l-82.34,82.35a8,8,0,0,1-11.32,0L96,123.31,29.66,189.66a8,8,0,0,1-11.32-11.32l72-72a8,8,0,0,1,11.32,0L136,140.69,212.69,64H168a8,8,0,0,1,0-16h64A8,8,0,0,1,240,56Z"></path></svg>4</span>
</div>
</div>
<div style="flex:1;display:flex;flex-direction:column;gap:10px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="3">
<div style="display:flex;align-items:center;gap:8px">
<span style="color:{{b.c}};display:flex" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor"><path d="{{b.d}}"></path></svg></span>
<span style="flex:1;height:6px;border-radius:3px;background:#2A2A2F;display:block" role="img" aria-label="{{b.k}}: {{b.v}}"><span style="display:block;height:6px;border-radius:3px;width:{{b.w}};background:{{b.c}}"></span></span>
<span style="width:52px;font-size:12px;color:#A1A1A8;text-align:right">{{b.v}}</span>
</div>
</sc-for>
</div>
</div>

<div style="display:flex;flex-direction:column">
<sc-for list="{{trips}}" as="tr" hint-placeholder-count="4">
<a href="#" style="min-height:60px;display:flex;align-items:center;gap:12px;color:#F2F2F3;text-decoration:none;box-shadow:{{tr.sep}}">
<span style="width:40px;font-size:12px;color:#A1A1A8;font-variant-numeric:tabular-nums">{{tr.time}}</span>
<svg width="8" height="34" viewBox="0 0 8 34" aria-hidden="true" style="flex:none"><circle cx="4" cy="4" r="3" fill="none" stroke="#A1A1A8" stroke-width="1.6"></circle><path d="M4 8 L4 26" stroke="#3A3A40" stroke-width="2" stroke-dasharray="2 3"></path><circle cx="4" cy="30" r="3.4" fill="#7CC7FF"></circle></svg>
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:14px">
<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#A1A1A8">{{tr.from}}</span>
<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{tr.to}}</span>
</span>
<span style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;font-variant-numeric:tabular-nums">
<span style="padding:2px 8px;border-radius:10px;background:#17171A">{{tr.km}}</span>
<span style="color:#A1A1A8">{{tr.min}}</span>
</span>
</a>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const km = [18, 26, 0, 31, 22, 12, 33];
    const days = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
    const max = Math.max(...km);
    return {
      weekLabel: km.map((k, i) => days[i] + ' ' + k + ' km').join(', '),
      week: km.map((k, i) => ({
        d: days[i],
        h: Math.max(4, Math.round((k / max) * 64)) + 'px',
        c: i === 6 ? '#7CC7FF' : k ? '#3A3A40' : '#232327',
        lc: i === 6 ? '#F2F2F3' : '#A1A1A8',
      })),
      bars: [
        { k: 'Acceleration', v: 'Gentle', w: '84%', c: '#7CC7FF', d: 'M215.79,118.17a8,8,0,0,0-5-5.66L153.18,90.9l14.66-73.33a8,8,0,0,0-13.69-7l-112,120a8,8,0,0,0,3,13l57.63,21.61L88.16,238.43a8,8,0,0,0,13.69,7l112-120A8,8,0,0,0,215.79,118.17ZM109.37,214l10.47-52.38a8,8,0,0,0-5-9.06L62,132.71l84.62-90.66L136.16,94.43a8,8,0,0,0,5,9.06l52.8,19.8Z' },
        { k: 'Braking', v: '2 hard', w: '62%', c: '#FFB547', d: 'M128,56a32,32,0,1,0,32,32A32,32,0,0,0,128,56Zm0,48a16,16,0,1,1,16-16A16,16,0,0,1,128,104Zm0,32a32,32,0,1,0,32,32A32,32,0,0,0,128,136Zm0,48a16,16,0,1,1,16-16A16,16,0,0,1,128,184Zm88-40H200V80h16a8,8,0,0,0,0-16H200V40a16,16,0,0,0-16-16H72A16,16,0,0,0,56,40V64H40a8,8,0,0,0,0,16H56v64H40a8,8,0,0,0,0,16H56v56a16,16,0,0,0,16,16H184a16,16,0,0,0,16-16V160h16a8,8,0,0,0,0-16Zm-32,72H72V40H184V216Z' },
        { k: 'Speed', v: 'OK', w: '92%', c: '#7CC7FF', d: 'M114.34,154.34l96-96a8,8,0,0,1,11.32,11.32l-96,96a8,8,0,0,1-11.32-11.32ZM128,88a63.9,63.9,0,0,1,20.44,3.33,8,8,0,1,0,5.11-15.16A80,80,0,0,0,48.49,160.88,8,8,0,0,0,56.43,168c.29,0,.59,0,.89-.05a8,8,0,0,0,7.07-8.83A64.92,64.92,0,0,1,64,152,64.07,64.07,0,0,1,128,88Zm99.74,13a8,8,0,0,0-14.24,7.3,96.27,96.27,0,0,1,5,75.71l-181.1-.07A96.24,96.24,0,0,1,128,56h.88a95,95,0,0,1,42.82,10.5A8,8,0,1,0,179,52.27a112,112,0,0,0-156.66,137A16.07,16.07,0,0,0,37.46,200H218.53a16,16,0,0,0,15.11-10.71,112.35,112.35,0,0,0-5.9-88.3Z' },
      ],
      trips: [
        ['07:42', 'Thảo Điền', 'Quận 1', '8.2 km', '24 min'],
        ['18:10', 'Quận 1', 'Thảo Điền', '8.6 km', '31 min'],
        ['Yest.', 'Thảo Điền', 'Landmark 81', '3.1 km', '12 min'],
        ['Mon', 'Thủ Đức', 'Phú Mỹ Hưng', '19.4 km', '38 min'],
      ].map(([time, from, to, km2, min], i) => ({ time, from, to, km: km2, min, sep: i ? 'inset 0 1px 0 #1F1F23' : 'none' })),
    };
  }
}
</script>
</body>
</html>
